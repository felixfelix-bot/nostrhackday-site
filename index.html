<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOSTR HACKDAY</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <article class="card">
        <header class="card-header">
            <div class="header-ornament">▲▲▲</div>
            <h1 class="header-title">Nostrhackday</h1>
            <div class="header-ornament">▲▲▲</div>
        </header>
        
        <main class="card-content">
            <div class="content-primary">
                <h2 class="main-headline">Nostrhackday</h2>
                <h3 class="main-subline">Let's Build on Nostr</h3>
            </div>
            <div class="content-secondary">
                <p class="event-tagline">A daytime hackday for building on Nostr.</p>
            </div>
            <div class="content-meta">
                <time class="event-date" datetime="2026-09-30">September 30th, 2026</time>
                <p class="event-subtitle">10:00 - 18:30</p>
                <div class="event-links">
                    <p class="event-link"><a href="https://c-base.org/" target="_blank" rel="noreferrer noopener">c-base — the crashed space station in Berlin</a></p>
                </div>
            </div>
        </main>
        
        <footer class="card-footer">
            <div class="footer-symbol">
            </div>
            <div class="footer-details">
                <div class="detail-group">
                    <p class="detail-line">Nostrhackday</p>
                    <p class="detail-line">c-base, Rungestraße 20, 10179 Berlin</p>
                </div>
            </div>
            <div class="footer-meta">
                <div class="detail-group">
                    <p class="detail-line">Wednesday</p>
                    <p class="detail-line">30.09.2026</p>
                    <p class="detail-line">10:00 - 18:30</p>
                </div>
            </div>
            <div class="footer-action">
                <a href="https://c-base.org/"
                   target="_blank"
                   rel="noreferrer noopener"
                   class="signup-button">
                    SIGN UP
                </a>
                
            </div>
        </footer>
    </article>
</body>
</html>
